[env:black_f407zg]
platform = ststm32
board = black_f407zg
framework = stm32cube
upload_protocol = stlink
monitor_speed = 115200
build_flags =
    -Iinclude
    -Ilib/FreeRTOS/include
    -Ilib/FreeRTOS/portable/GCC/ARM_CM4F
    -mcpu=cortex-m4
    -mthumb
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp
link_flags =
    -mcpu=cortex-m4
    -mthumb
    -mfpu=fpv4-sp-d16
    -mfloat-abi=softfp